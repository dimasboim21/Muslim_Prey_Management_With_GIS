<body><header><div><p class="eyebrow">Muslim Prayer Management</p><h1 data-i18n="ua.title">Administrasi pengguna</h1></div><nav><span data-language-slot></span><a href="quran.html" data-i18n="ua.reader">Buka pembaca</a><button id="logoutButton" hidden data-i18n="ua.logout">Keluar</button></nav></header>
<main><p id="accountStatus" role="status" aria-live="polite"></p>
<section id="loginSection" hidden class="card login" data-access-key="card:loginSection"><h2 data-i18n="ua.login">Login</h2><form id="loginForm"><label><span data-i18n="ua.username">Username</span><input id="loginUsername" autocomplete="username" required maxlength="60"></label><label><span data-i18n="ua.password">Password</span><input id="loginPassword" type="password" autocomplete="current-password" required maxlength="72"></label><button class="primary" type="submit" data-i18n="ua.login">Login</button></form></section>
<section id="accountSection" hidden data-access-key="card:accountSection"><div class="card account-heading" data-access-key="card:section-2"><div class="signed-in-profile"><div id="signedInAvatar"></div><div><h2 id="signedInName"></h2><p id="signedInUsername"></p><p id="signedInRole"></p><p id="signedInUniqueId"></p><p id="signedInCreatedAt"></p></div></div><button id="ownProfileButton" data-i18n="ua.ownProfile">Profil saya</button></div>
<div class="card" data-access-key="card:section-3"><div class="list-heading"><h2 data-i18n="ua.users">Pengguna</h2><button id="newAccountButton" class="primary" data-i18n="ua.add">Tambah pengguna</button></div><div class="filters"><label><span data-i18n="ua.search">Cari nama / username</span><input id="accountSearch" type="search"></label><label><span data-i18n="ua.status">Status</span><select id="accountFilter"><option value="active" data-i18n="ua.active">Aktif</option><option value="deleted" data-i18n="ua.deleted">Dihapus</option><option value="all" data-i18n="ua.all">Semua</option></select></label></div><div id="roleCounts" class="role-counts"></div><div class="account-table-scroll"><table class="account-table"><thead><tr><th data-i18n="ua.photoColumn">Foto</th><th><button type="button" data-sort="name" data-i18n="ua.name">Nama lengkap</button></th><th><button type="button" data-sort="username" data-i18n="ua.username">Username</button></th><th><button type="button" data-sort="uniqueId" data-i18n="ua.uniqueId">ID unik</button></th><th><button type="button" data-sort="role" data-i18n="ua.role">Tingkatan</button></th><th><button type="button" data-sort="createdAt" data-i18n="ua.createdAt">Tanggal pendaftaran</button></th><th><button type="button" data-sort="deletedAt" data-i18n="ua.status">Status</button></th><th data-i18n="ua.actions">Tindakan</th></tr></thead><tbody id="accountList"></tbody></table></div></div>
</section><section id="urlAccessManagement" class="card" hidden data-access-key="card:urlAccessManagement"></section></main>
<dialog id="accountDialog"><div class="list-heading"><h2 id="accountFormTitle"></h2><button id="closeAccountDialog" type="button" data-i18n="ua.close">Tutup</button></div>
<p id="accountIdentityInfo"></p><form id="accountForm"><input id="accountId" type="hidden"><label id="legacyProfileLabel" hidden><span data-i18n="ua.legacy">Hubungkan profil lama (opsional)</span><select id="legacyProfileSelect"></select></label>
<div class="form-grid"><label><span data-i18n="ua.name">Nama</span><input id="accountName" required maxlength="120" autocomplete="name"></label><label><span data-i18n="ua.username">Username</span><input id="accountUsername" required minlength="3" maxlength="60" autocomplete="off" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,59}"></label><label><span data-i18n="ua.role">Tingkatan</span><select id="accountRole"></select></label><label><span data-i18n="ua.newPassword">Password baru (kosongkan untuk mempertahankan)</span><input id="accountPassword" type="password" minlength="10" maxlength="72" autocomplete="new-password"></label><label id="currentPasswordLabel"><span data-i18n="ua.currentPassword">Password saat ini (untuk mengganti password sendiri)</span><input id="accountCurrentPassword" type="password" autocomplete="current-password"></label></div>
<div id="profileDetailFields" class="form-grid"></div>
<fieldset id="permissionFields" data-access-key="card:permissionFields"><legend data-i18n="ua.permissions">Izin pengelolaan pengguna</legend><label><input type="checkbox" name="permission" value="users.create"><span data-i18n="ua.permCreate">Tambah akun tingkat lebih rendah</span></label><label><input type="checkbox" name="permission" value="users.update"><span data-i18n="ua.permUpdate">Lihat dan ubah akun tingkat lebih rendah</span></label><label><input type="checkbox" name="permission" value="users.delete"><span data-i18n="ua.permDelete">Hapus dan pulihkan akun tingkat lebih rendah</span></label><p data-i18n="ua.permissionRule">Batas tingkatan selalu berlaku. Hanya Developer yang dapat mengubah izin ini.</p></fieldset>
