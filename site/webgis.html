    <style>
        /* Local controls for the astronomical control/display page. */
        .astro-map-context,
        .astro-method-summary,
        .astro-parameter-status,
        .astro-observation-status {
            background: #f5f8fa;
            border: 1px solid #dce5ed;
            border-radius: 8px;
            color: #405166;
            font-size: 12px;
            line-height: 1.45;
            margin: 12px 0;
            padding: 10px;
        }

        .astro-map-context {
            display: grid;
            gap: 6px;
        }

        .astro-map-context strong,
        .astro-method-summary strong,
        .astro-parameter-status strong,
        .astro-observation-status strong {
            color: #172033;
        }

        .astro-details {
            background: #fbfcfd;
            border: 1px solid #dce5ed;
            border-radius: 8px;
            margin-top: 14px;
            padding: 0 10px 10px;
        }

        .astro-details summary {
            color: #172033;
            cursor: pointer;
            font-size: 12px;
            font-weight: 850;
            padding: 11px 0;
        }

        .astro-details[open] summary {
            border-bottom: 1px solid #e3eaf0;
            margin-bottom: 11px;
        }

        .astro-help {
            color: #647385;
            font-size: 11px;
            line-height: 1.45;
            margin: 0 0 10px;
        }

        .astro-inline-toggle {
            align-items: center;
            color: #324153;
            display: inline-flex;
            font-size: 12px;
            font-weight: 750;
            gap: 7px;
            margin: 2px 0 10px;
        }

        .astro-inline-toggle input {
            accent-color: #176a58;
            height: 16px;
            margin: 0;
            width: 16px;
        }

        .astro-manual-fields[hidden],
        .astro-method-picker[hidden] {
            display: none;
        }

        .astro-compact-grid {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin: 10px 0;
        }

        .astro-compact-grid label span {
            font-size: 10px;
        }

        .astro-textarea {
            background: #fff;
            border: 1px solid #c9d5e2;
            border-radius: 6px;
            color: #172033;
            min-height: 72px;
            outline: none;
            padding: 7px 8px;
            resize: vertical;
            width: 100%;
        }

        .astro-textarea:focus {
            border-color: #176a58;
            box-shadow: 0 0 0 3px rgba(23, 106, 88, 0.15);
        }

        .astro-compass-head {
            align-items: center;
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-top: 12px;
        }

        .astro-compass-head label {
            max-width: 220px;
            width: 100%;
        }

        .astro-compass-preview {
            align-items: center;
            background: #f7fafb;
            border: 1px solid #e0e8ef;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            margin: 10px 0;
            padding: 8px;
        }

        .astro-compass-preview img {
            animation: astro-compass-pulse 3.6s ease-in-out infinite;
            border-radius: 50%;
            height: 42px;
            object-fit: cover;
            width: 42px;
        }

        .astro-compass-preview p {
            color: #526173;
            font-size: 11px;
            line-height: 1.35;
            margin: 0;
        }

        .astro-compass-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 8px 0 12px;
        }

        .astro-compass-key {
            align-items: center;
            background: #fff;
            border: 1px solid #cbd6df;
            border-radius: 999px;
            color: #223247;
            cursor: default;
            display: inline-flex;
            font-size: 10px;
            font-style: normal;
            font-weight: 850;
            min-height: 25px;
            outline: none;
            padding: 4px 7px;
        }

        .astro-compass-key:focus,
        .astro-compass-key:hover {
            border-color: #176a58;
        }

        .astro-compass-name {
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-width 180ms ease, margin-left 180ms ease, opacity 180ms ease;
            white-space: nowrap;
        }

        .astro-compass-key:focus .astro-compass-name,
        .astro-compass-key:hover .astro-compass-name {
            margin-left: 4px;
            max-width: 128px;
            opacity: 1;
        }

        .astro-observation-preview {
            background: #111821;
            border-radius: 8px;
            color: #dce9ef;
            font-family: Consolas, "Courier New", monospace;
            font-size: 10px;
            line-height: 1.4;
            margin: 10px 0 0;
            max-height: 220px;
            overflow: auto;
            padding: 10px;
            white-space: pre-wrap;
        }

        @keyframes astro-compass-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(23, 106, 88, 0.12); transform: scale(1); }
            50% { box-shadow: 0 0 0 6px rgba(23, 106, 88, 0); transform: scale(1.03); }
        }

        @media (max-width: 720px) {
            .astro-compact-grid {
                grid-template-columns: 1fr;
            }

            .astro-compass-head {
                align-items: stretch;
                flex-direction: column;
            }

            .astro-compass-head label {
                max-width: none;
            }
        }
    </style>
